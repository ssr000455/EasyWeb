name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  SDL2_VERSION: 2.30.12

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Cache Cargo & SDL2
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/sdl2-android
          key: ${{ runner.os }}-build-${{ hashFiles('Cargo.lock') }}-sdl2-${{ env.SDL2_VERSION }}

      - name: Build everything
        run: |
          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ | head -1)
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build

          # --- 构建 SDL2（如果缓存未命中）---
          if [ ! -d ~/sdl2-android/aarch64 ]; then
            echo "Building SDL2 and SDL2_ttf from source..."

            build_sdl2() {
              local ARCH=$1; local ABI=$2; local PREFIX=~/sdl2-android/$ARCH
              wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
              tar xzf "SDL2-${SDL2_VERSION}.tar.gz"
              cd "SDL2-${SDL2_VERSION}"
              cmake -B build-$ARCH \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=$ABI -DANDROID_PLATFORM=21 \
                -DCMAKE_INSTALL_PREFIX=$PREFIX \
                -DSDL_TEST=OFF -DSDL_STATIC=ON -G Ninja
              cmake --build build-$ARCH --target install
              cd .. && rm -rf "SDL2-${SDL2_VERSION}"*
            }

            build_sdl2_ttf() {
              local ARCH=$1; local ABI=$2; local PREFIX=~/sdl2-android/$ARCH
              local TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/libsdl-org/SDL_ttf.git \
                | grep -oP 'release-\K2\.[0-9]+\.[0-9]+' | head -1)
              echo "SDL2_ttf: release-$TAG"
              wget -q "https://github.com/libsdl-org/SDL_ttf/releases/download/release-${TAG}/SDL2_ttf-${TAG}.tar.gz"
              tar xzf "SDL2_ttf-${TAG}.tar.gz"
              cd "SDL2_ttf-${TAG}"
              cmake -B build-$ARCH \
                -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=$ABI -DANDROID_PLATFORM=21 \
                -DCMAKE_INSTALL_PREFIX=$PREFIX \
                -DCMAKE_PREFIX_PATH=$PREFIX \
                -DSDL2_INCLUDE_DIR=$PREFIX/include/SDL2 \
                -DSDL2_LIBRARY=$PREFIX/lib/libSDL2.a \
                -DSDL2TTF_VENDORED=ON -DSDL2TTF_HARFBUZZ=OFF \
                -DSDL2TTF_STATIC=ON -DSDL2TTF_SHARED=OFF -G Ninja
              cmake --build build-$ARCH --target install
              cd .. && rm -rf "SDL2_ttf-${TAG}"*
            }

            build_sdl2 "aarch64" "arm64-v8a"
            build_sdl2_ttf "aarch64" "arm64-v8a"
            build_sdl2 "armv7" "armeabi-v7a"
            build_sdl2_ttf "armv7" "armeabi-v7a"
            build_sdl2 "x86_64" "x86_64"
            build_sdl2_ttf "x86_64" "x86_64"
          else
            echo "SDL2 cached, skipping build."
          fi

          # --- 安装 cargo-ndk ---
          cargo install cargo-ndk

          # --- 构建 Rust 库 + 复制到 jniLibs ---
          mkdir -p android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}

          for target in "aarch64,arm64-v8a" "armv7,armeabi-v7a" "x86_64,x86_64"; do
            ARCH=$(echo $target | cut -d, -f1)
            ABI=$(echo $target | cut -d, -f2)
            export SDL2_DIR=~/sdl2-android/$ARCH
            echo "Building for $ARCH ($ABI)..."
            cargo ndk -t $ABI --platform 21 build --release --lib

            cp target/$ARCH-linux-android/release/libeasyweb.so \
              android/app/src/main/jniLibs/$ABI/
            cp ~/sdl2-android/$ARCH/lib/libSDL2.so \
              android/app/src/main/jniLibs/$ABI/ 2>/dev/null || true
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easyweb-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          compression-level: 0