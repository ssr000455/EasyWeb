[package]
name = "easyweb"
version = "0.1.0"
edition = "2021"
description = "A lightweight independent web rendering engine"

[lib]
name = "easyweb"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "easyweb"
path = "src/main.rs"

# Non-Android: use static-link for SDL2
[target.'cfg(not(target_os = "android"))'.dependencies.sdl2]
version = "0.37"
features = ["ttf", "image", "static-link"]

# Android: no static-link (SDL2main doesn't exist for Android)
[target.'cfg(target_os = "android")'.dependencies.sdl2]
version = "0.37"
features = ["ttf", "image", "use-pkgconfig"]

[package.metadata.android]
package = "com.easyweb.app"
name = "EasyWeb"
version = "0.1.0"
orientation = "sensor"